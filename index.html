<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Traceback never talks to a server: scripts, styles, fonts and network
      requests are limited to the app itself (plus Vite's dev-server socket).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Traceback keeps the evidence behind your decisions connected. Local-first: everything stays in this browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Traceback — Evidence, connected</title>
  </head>
  <body>
    <noscript>Traceback needs JavaScript. Your data stays in this browser either way.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
